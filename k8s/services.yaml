apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: drift-detector
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5138
      nodePort: 31138
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: drift-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 31200
