apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  labels:
    app: backend
spec:
  containers:
    - name: backend
      image: drift-backend:1.0
      ports:
        - containerPort: 5138   # ✅ FIXED (was 8001)

      env:
        - name: ASPNETCORE_URLS
          value: "http://+:5138"   # ✅ IMPORTANT

        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres;Port=5432;Database=DriftDb;Username=postgres;Password=root"