apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: drift-detector
  labels:
    app: drift-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drift-frontend
  template:
    metadata:
      labels:
        app: drift-frontend
    spec:
      containers:
      - name: drift-frontend
        image: drift-frontend:1.0
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
