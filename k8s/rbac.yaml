# --- ServiceAccount ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-detector-sa
  namespace: drift-detector
  labels:
    app: environment-drift-detector
---
# --- Role: what permissions are granted within the namespace ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drift-detector-role
  namespace: drift-detector
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
# --- RoleBinding: bind the role to the ServiceAccount ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drift-detector-rolebinding
  namespace: drift-detector
subjects:
  - kind: ServiceAccount
    name: drift-detector-sa
    namespace: drift-detector
roleRef:
  kind: Role
  name: drift-detector-role
  apiGroup: rbac.authorization.k8s.io
---
# --- ClusterRole: read-only view across the WHOLE cluster (for monitoring) ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drift-detector-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
# --- ClusterRoleBinding: bind ClusterRole to our SA ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drift-detector-cluster-rolebinding
subjects:
  - kind: ServiceAccount
    name: drift-detector-sa
    namespace: drift-detector
roleRef:
  kind: ClusterRole
  name: drift-detector-cluster-reader
  apiGroup: rbac.authorization.k8s.io
