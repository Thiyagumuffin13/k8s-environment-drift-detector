# Values are base64 encoded:
#   postgres   -> cG9zdGdyZXM=
#   root       -> cm9vdA==
#   DriftDb    -> RHJpZnREYg==
#
# Encode your own:  echo -n "mypassword" | base64
# Decode to verify: echo "cm9vdA==" | base64 --decode
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: drift-detector
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cm9vdA==
  POSTGRES_DB: RHJpZnREYg==
